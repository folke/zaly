name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish unpublished versions after verification (main only)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"
      - uses: actions/setup-node@v4
        with:
          node-version: "22.18.0"
      - run: bun --workspaces install --frozen-lockfile
      - run: bun install --frozen-lockfile --lockfile-only
        shell: bash
      - name: Download and add actionlint to PATH
        shell: bash
        run: |
          # Download latest and add to PATH
          mkdir -p "$RUNNER_TEMP/bin"
          bash <(curl https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) "latest" "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: bun z lint
      - run: bun z build
      - run: bun z test --bun
      - name: Check generated artifacts
        run: |
          if ! git diff --quiet; then
            git status --short
            git diff --stat
            echo "::error::Generated artifacts changed. Run 'bun z build' and commit the result."
            exit 1
          fi
      - run: bun z pack --out release-artifacts
      - name: Smoke-test packed packages
        run: RELEASE_ARTIFACTS="$PWD/release-artifacts" bun z test packages/dev/test/release.integration.test.ts
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish))
        with:
          name: packed-release
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 30

  release:
    needs: build
    concurrency:
      group: release-please
      cancel-in-progress: false
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release-please.outputs.release_created }}
    steps:
      - name: Create automation token
        id: automation-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.AUTOMATION_APP_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
      - uses: googleapis/release-please-action@v4
        id: release-please
        with:
          token: ${{ steps.automation-token.outputs.token }}
          config-file: .github/release-please-config.json
          manifest-file: .github/release-please-manifest.json
          target-branch: main
      - name: Check release matches the verified commit
        if: steps.release-please.outputs.release_created == 'true'
        uses: actions/github-script@v7
        env:
          RELEASE_SHA: ${{ steps.release-please.outputs.sha }}
          VERIFIED_SHA: ${{ github.sha }}
        with:
          script: |
            if (process.env.RELEASE_SHA !== process.env.VERIFIED_SHA) {
              throw new Error('Release tag differs from the verified commit; use manual recovery');
            }

  publish:
    needs: [build, release]
    if: >-
      !cancelled() && needs.build.result == 'success' && github.ref == 'refs/heads/main' &&
      ((github.event_name == 'workflow_dispatch' && inputs.publish) ||
       (github.event_name == 'push' && needs.release.result == 'success' && needs.release.outputs.release_created == 'true'))
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    environment: npm
    concurrency:
      group: npm-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"
      - uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          name: packed-release
          path: release-artifacts
      - run: bun z publish --artifacts release-artifacts --provenance

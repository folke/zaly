name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Run Changesets release automation after verification (main only)
        type: boolean
        default: false

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"
      - uses: actions/setup-node@v4
        with:
          node-version: "22.18.0"
      - uses: pnpm/action-setup@v4
        with:
          version: "12.3.4"
          run_install: false
      - run: bun --workspaces install --frozen-lockfile
      - run: bun install --frozen-lockfile --lockfile-only
      - name: Download and add actionlint to PATH
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          bash <(curl https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) "latest" "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: bun z lint
      - name: Cache ttsc plugin binaries
        uses: actions/cache@v4
        with:
          path: node_modules/.cache/ttsc/plugins
          key: ${{ runner.os }}-${{ runner.arch }}-ttsc-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-ttsc-
      - run: bun z build
      - run: bun z test --bun
      - name: Check generated artifacts
        run: |
          if ! git diff --quiet; then
            git status --short
            git diff --stat
            echo "::error::Generated artifacts changed. Run 'bun z build' and commit the result."
            exit 1
          fi
      - name: Pack every public package for verification (no registry lookups)
        run: |
          bun -e 'import { verificationPlan } from "./packages/dev/test/helpers/packed.ts"; await verificationPlan(process.argv[1])' "$RUNNER_TEMP/verify-plan.json"
          bun changeset pack --from-publish-plan "$RUNNER_TEMP/verify-plan.json" --out-dir "$RUNNER_TEMP/verify-pack"
      - name: Smoke-test packed packages
        run: RELEASE_ARTIFACTS="$RUNNER_TEMP/verify-pack" bun z test packages/dev/test/release.integration.test.ts

  select-mode:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
      publish-plan-artifact-id: ${{ steps.mode.outputs.publish-plan-artifact-id }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"
      - uses: actions/setup-node@v4
        with:
          node-version: "24.x"
      - uses: pnpm/action-setup@v4
        with:
          version: "12.3.4"
          run_install: false
      - run: bun install --frozen-lockfile --ignore-scripts
      - uses: changesets/action/select-mode@v2.1.2
        id: mode

  version:
    needs: [build, select-mode]
    if: needs.select-mode.outputs.mode == 'version'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: changesets-version
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"
      - uses: actions/setup-node@v4
        with:
          node-version: "24.x"
      - run: bun install --frozen-lockfile --ignore-scripts
      - uses: changesets/action/version@v2.1.2
        with:
          script: bun run version-packages
          commit-message: "chore(release): version packages"
          pr-title: "chore(release): version packages"

  pack:
    needs: [build, select-mode]
    if: needs.select-mode.outputs.mode == 'publish'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      pack-dir-artifact-id: ${{ steps.pack.outputs.pack-dir-artifact-id }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"
      - uses: actions/setup-node@v4
        with:
          node-version: "22.18.0"
      - uses: pnpm/action-setup@v4
        with:
          version: "12.3.4"
          run_install: false
      - run: bun install --frozen-lockfile
      - name: Cache ttsc plugin binaries
        uses: actions/cache@v4
        with:
          path: node_modules/.cache/ttsc/plugins
          key: ${{ runner.os }}-${{ runner.arch }}-ttsc-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-ttsc-
      - run: bun z build
      - name: Check generated artifacts
        run: git diff --exit-code
      - uses: changesets/action/pack@v2.1.2
        id: pack
        with:
          publish-plan-artifact-id: ${{ needs.select-mode.outputs.publish-plan-artifact-id }}
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.pack.outputs.pack-dir-artifact-id }}
          path: release-artifacts
      - name: Smoke-test the exact publication artifacts
        run: RELEASE_ARTIFACTS="$PWD/release-artifacts" bun z test packages/dev/test/release.integration.test.ts

  publish:
    needs: pack
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      id-token: write
    concurrency:
      group: npm-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"
      - uses: actions/setup-node@v4
        with:
          node-version: "24.x"
      - uses: pnpm/action-setup@v4
        with:
          version: "12.3.4"
          run_install: false
      - run: bun install --frozen-lockfile --ignore-scripts
      - uses: changesets/action/publish@v2.1.2
        env:
          NPM_CONFIG_PROVENANCE: "true"
        with:
          pack-dir-artifact-id: ${{ needs.pack.outputs.pack-dir-artifact-id }}
          create-github-releases: true
          push-git-tags: true
